---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-carolyn
  # Reloader (mocha/system/reloader) is cluster-wide and watches ConfigMaps
  # referenced by this Deployment: any change to hermes-carolyn-config (e.g.
  # the terminal.backend block) triggers a pod rollout automatically, so the
  # seed-config init container re-copies config.yaml onto the PVC.
  annotations:
    configmap.reloader.stakater.com/reload: "hermes-carolyn-config"
  labels:
    app.kubernetes.io/name: hermes-carolyn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-carolyn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-carolyn
    spec:
      serviceAccountName: sbx
      initContainers:
        - name: seed-config
          image: busybox:1.38
          command:
            - sh
            - -c
            # Unconditional, not "seed once". With `test -f || cp` a change to
            # config.yaml in git never reached an existing PVC: the deploy went
            # green, the pod kept the old file, and the new MCP server silently
            # did not exist. Git is the source of truth for this file, exactly
            # like the skills this pod rewrites on every start.
            - |
              set -eu
              cp /opt/data/config.yaml /opt/data/config.yaml.prev 2>/dev/null || true
              cp /config/config.yaml /opt/data/config.yaml
              cp /config/SOUL.md /opt/data/SOUL.md
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /config
        # workspace-mcp reads <email>.json from its credentials dir and writes
        # refreshed tokens back, so the Secret is copied to a writable emptyDir
        # (as the image's `app` user, uid 1000, so the 0600 file stays readable).
        - name: seed-calendar-creds
          image: busybox:1.38
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - sh
            - -c
            - install -m 600 /seed/credentials.json "/store/${USER_GOOGLE_EMAIL}.json"
          env:
            - name: USER_GOOGLE_EMAIL
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn-calendar-mcp
                  key: user_google_email
          volumeMounts:
            - name: calendar-seed
              mountPath: /seed
              readOnly: true
            - name: calendar-creds
              mountPath: /store
        # Share the agent source with the webui container: the webui discovers
        # the agent at $HERMES_HOME/hermes-agent (same layout as the upstream
        # two-container compose).
        # Same image as the hermes-carolyn container, so the webui and the
        # gateway always run the same agent version.
        - name: seed-agent-src
          image: docker.io/nousresearch/hermes-agent:v0.23.3-desktop
          command:
            - sh
            - -c
            - |
              cp -a /opt/hermes/. /agent-src/
              # The image ships two defects that break both the dashboard and
              # `hermes plugins install|update`; repair them on the copy because
              # this container is the only writer of agent-src.
              #
              # 1. .venv/bin/python points at /usr/local/bin/python3. The webui
              #    image is Debian trixie, whose python3 is 3.12, while the venv
              #    is built for 3.14.9 (pyvenv.cfg, and every wheel is a
              #    cp314 ABI tag). Under 3.12 pydantic_core fails to load with
              #    "undefined symbol: PyDict_GetItemRef", so the dashboard dies
              #    before serving. Point it at the bundled 3.14 interpreter.
              #    The target must stay RELATIVE: agent-src is an emptyDir mounted at
              #    /agent-src here but at $HERMES_HOME/hermes-agent in the webui and
              #    agent containers, so an absolute target resolves only during this
              #    init container and is dangling for every consumer afterwards.
              ln -sfn ../../tools/python-3.14.9+20261021-linux-x64/bin/python3.14 \
                /agent-src/.venv/bin/python
              # 2. install-stamp.json bakes pmRuntime as /opt/hermes/pm-runtime,
              #    the path in the agent image. The copy lives at /agent-src, so
              #    PM refuses to run ("packaged PM runtime is missing or
              #    invalid") and every plugin install/update aborts. Rewrite it
              #    to the relocated runtime.
              #    Use the bundled interpreter: the base image does not guarantee
              #    a python3 on PATH, and this is the one the venv targets anyway.
              /agent-src/tools/python-3.14.9+20261021-linux-x64/bin/python3.14 -c \
                'import json, pathlib; p = pathlib.Path("/agent-src/install-stamp.json"); s = json.loads(p.read_text()); s["pmRuntime"] = "/agent-src/pm-runtime"; p.write_text(json.dumps(s) + "\n")'
          volumeMounts:
            - name: agent-src
              mountPath: /agent-src
        # Cron fleet reconciliation. The seed rewrites config.yaml but nothing
        # ever touches cron state, so jobs.json lived only on the PVC and was
        # lost with the volume; this makes the fleet durable. Runs after
        # seed-agent-src because it imports cron.jobs from the copied tree, and
        # before the gateway starts so the ticker sees the final set.
        # Never fatal: a broken reconcile must not stop the agent from booting.
        - name: sync-cron
          image: docker.io/nousresearch/hermes-agent:v0.23.3-desktop
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          command:
            - sh
            - -c
            - |
              set -eu
              /agent-src/.venv/bin/python /cron-spec/cron-sync.py \
                --spec /cron-spec/spec.json \
                --home /opt/data \
                --agent-root /agent-src \
                || echo "cron-sync failed; the existing jobs.json is untouched"
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: agent-src
              mountPath: /agent-src
            - name: cron-spec
              mountPath: /cron-spec
          env:
            # The committed spec carries ${CRON_CHANNEL_*} and ${MAIL_ADDRESS_*}
            # references instead of the real values; these are what they resolve to.
            - name: CRON_CHANNEL_NEWS
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: cron_channel_news
            - name: CRON_CHANNEL_BRIEFING
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: cron_channel_briefing
            - name: MAIL_ADDRESS_CATCHALL
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn-email-mcp
                  key: mail_address_catchall
            - name: GOOGLE_CALENDAR_EMAIL
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn-calendar-mcp
                  key: user_google_email
        # cua-driver, the driver behind the computer_use toolset. Hermes PM
        # installs the version it pins into $HERMES_HOME/tools, on the PVC, so
        # this is a few seconds' no-op once it is there and a repair after a
        # Hermes bump that moves the pin. Not fatal: without it the agent loses
        # computer_use, not the rest.
        - name: install-cua-driver
          image: docker.io/nousresearch/hermes-agent:v0.23.3-desktop
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          command:
            - sh
            - -c
            - /opt/hermes/bin/hermes computer-use install || echo "cua-driver install failed, computer_use stays unavailable"
          env:
            - name: HOME
              value: /opt/data
            - name: HERMES_HOME
              value: /opt/data
          volumeMounts:
            - name: data
              mountPath: /opt/data
        # Desktop plugins for the webui app. Always overwritten: unlike config.yaml
        # there is no runtime state to preserve, and a hand-edited copy on the PVC
        # would otherwise win over the repo forever.
        - name: seed-desktop-plugins
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/data/desktop-plugins/github-pane
              cp /src/desktop-plugins/github-pane.js /opt/data/desktop-plugins/github-pane/plugin.js
              printf '{"package":"github-pane"}\n' > /opt/data/desktop-plugins/github-pane/.hermes-package.json
              chmod -R a+rX /opt/data/desktop-plugins
              chown -R 10000:10000 /opt/data/desktop-plugins
          volumeMounts:
            - name: desktop-plugins
              mountPath: /src
              readOnly: true
            - name: data
              mountPath: /opt/data
        # sbx CLI + kubectl + in-cluster kubeconfig, shared with the agent containers
        - name: install-sbx
          image: docker.io/alpine/k8s:1.36.2
          command:
            - sh
            - -c
            - |
              cp /usr/bin/kubectl /opt/sbx/kubectl
              cp /src/sbx /opt/sbx/sbx
              cp /src/kubeconfig /opt/sbx/kubeconfig
              chmod +x /opt/sbx/sbx /opt/sbx/kubectl
              # static jq (the apk one is musl-linked and won't run on debian)
              wget -q https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -O /opt/sbx/jq && chmod +x /opt/sbx/jq
              # arr stack: scripts + ssh material for the Americano media server
              cp /src-arr/arr.sh /src-arr/socksconnect.py /opt/sbx/deluge_rpc.py /opt/sbx/plan_import.py /opt/sbx/purge_orphans.py /opt/sbx/
              chmod +x /opt/sbx/arr.sh /opt/sbx/socksconnect.py
              mkdir -p /opt/ssh
              cp /arr-secret/arr_ssh_key /opt/ssh/id_ed25519
              cp /src-arr/ssh_config /opt/ssh/config
              chmod 600 /opt/ssh/id_ed25519
              chown 10000:10000 /opt/ssh/id_ed25519 /opt/ssh/config
              printf '#!/bin/sh\nexec /usr/bin/ssh -F /opt/ssh/config "$@"\n' > /opt/sbx/ssh
              chmod +x /opt/sbx/ssh
              # Load the skills into hermes' skill dir (a ConfigMap mount would be
              # read-only and break the webui container's startup chown)
              mkdir -p /opt/data/skills/sbx /opt/data/skills/arr
              cp /src/SKILL.md /opt/data/skills/sbx/SKILL.md
              cp /src-arr/SKILL.md /opt/data/skills/arr/SKILL.md
              # Versioned skills: simple-english and i-have-adhd. These files are
              # replaced on every start (unlike config.yaml), so a fix committed
              # here wins over a stale copy on the volume. simple-english's
              # SKILL.md is split across numbered ConfigMaps because a single
              # object that size is unwieldy; the parts are concatenated.
              mkdir -p /opt/data/skills/simple-english/references
              cat /src-se1/SKILL.md.part1 /src-se2/SKILL.md.part2 /src-se3/SKILL.md.part3 > /opt/data/skills/simple-english/SKILL.md
              cp /src-refs/use-cases.md /opt/data/skills/simple-english/references/use-cases.md
              cp /src-refs/checklist.md /opt/data/skills/simple-english/references/checklist.md
              cp /src/SKILL.md /opt/data/skills/sbx/SKILL.md
              cp /src-arr/SKILL.md /opt/data/skills/arr/SKILL.md
          volumeMounts:
            - name: sbx-config
              mountPath: /src
              readOnly: true
            - name: arr-config
              mountPath: /src-arr
              readOnly: true
            - name: arr-secret
              mountPath: /arr-secret
              readOnly: true
            - name: sbx-tools
              mountPath: /opt/sbx
            - name: ssh-state
              mountPath: /opt/ssh
            - name: skill-se1
              mountPath: /src-se1
              readOnly: true
            - name: skill-se2
              mountPath: /src-se2
              readOnly: true
            - name: skill-se3
              mountPath: /src-se3
              readOnly: true
            - name: skill-refs
              mountPath: /src-refs
              readOnly: true
            - name: plugin-mistral-image
              mountPath: /src-plugin
              readOnly: true
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes-carolyn
          image: docker.io/nousresearch/hermes-agent:v0.23.3-desktop
          envFrom:
            - secretRef:
                name: hermes-carolyn
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HOME
              value: /opt/data
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: github_bot_token
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: github_token
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: mistral_api_key
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: webui_password
            - name: HERMES_WEBUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: webui_password
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: bot_token
            - name: HA_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: hass_token
            - name: HATCHDOOR_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: hatchdoor_token
            - name: SIGNOZ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: signoz_api_key
            - name: YT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: youtube_client_id
            - name: YT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: youtube_client_secret
            - name: YT_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-carolyn
                  key: youtube_refresh_token
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: sbx-tools
              mountPath: /opt/sbx
            - name: ssh-state
              mountPath: /opt/ssh
            - name: netbird-state
              mountPath: /var/run/netbird
        - name: webui
          image: docker.io/nousresearch/hermes-agent:v0.23.3-desktop
          envFrom:
            - secretRef:
                name: hermes-carolyn
          env:
            - name: HERMES_HOME
              value: /home/hermeswebui/.hermes
            - name: HOME
              value: /home/hermeswebui
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            # Two paths for the same `data` volume, deliberately: HERMES_HOME must
            # match what the gateway advertises (see the env block above), while the
            # webui image and its existing PVC layout keep using the hermeswebui
            # home. Moving the variable without this mount would leave the container
            # with an empty HERMES_HOME.
            - name: data
              mountPath: /opt/data
            - name: data
              mountPath: /home/hermeswebui/.hermes
            - name: agent-src
              mountPath: /home/hermeswebui/.hermes/hermes-agent
              readOnly: true
            - name: data
              mountPath: /workspace
            - name: sbx-tools
              mountPath: /opt/sbx
            - name: ssh-state
              mountPath: /opt/ssh
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-carolyn-data
        - name: agent-src
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: sbx-tools
          emptyDir: {}
        - name: ssh-state
          emptyDir: {}
        - name: netbird-state
          emptyDir: {}
        - name: sbx-config
          configMap:
            name: hermes-carolyn-sbx
        - name: arr-config
          configMap:
            name: hermes-carolyn-arr
        - name: cron-spec
          configMap:
            name: hermes-carolyn-cron
        - name: skill-se1
          configMap:
            name: hermes-carolyn-skill-se-part1
        - name: skill-se2
          configMap:
            name: hermes-carolyn-skill-se-part2
        - name: skill-se3
          configMap:
            name: hermes-carolyn-skill-se-part3
        - name: skill-refs
          configMap:
            name: hermes-carolyn-skill-simple-english-refs
        - name: skill-adhd
          configMap:
            name: hermes-carolyn-skill-i-have-adhd
        - name: skill-adhd-gemini
          configMap:
            name: hermes-carolyn-skill-i-have-adhd-gemini
        - name: plugin-mistral-image
          configMap:
            name: hermes-carolyn-plugin-mistral-image
        - name: arr-secret
          secret:
            secretName: hermes-carolyn
        - name: config
          configMap:
            name: hermes-carolyn-config
        - name: desktop-plugins
          configMap:
            name: hermes-carolyn-desktop-plugins
        - name: email-mcp-config
          secret:
            secretName: hermes-carolyn-email-mcp
        - name: calendar-seed
          secret:
            secretName: hermes-carolyn-calendar-mcp
            items:
              - key: credentials.json
                path: credentials.json
        - name: calendar-creds
          emptyDir: {}
        - name: mcp-cache
          emptyDir: {}
        - name: mcp-state
          emptyDir: {}
      terminationGracePeriodSeconds: 60
